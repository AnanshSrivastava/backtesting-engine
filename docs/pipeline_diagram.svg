<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1000" height="320" fill="#ffffff"/>

  <!-- Stage boxes -->
  <!-- 1. fetch_data -->
  <rect x="20" y="110" width="190" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="115" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b4b">fetch_data.py</text>
  <text x="115" y="168" text-anchor="middle" font-size="11" fill="#3730a3">yfinance OHLCV pull</text>
  <text x="115" y="184" text-anchor="middle" font-size="11" fill="#3730a3">clean + flatten columns</text>
  <text x="115" y="200" text-anchor="middle" font-size="11" fill="#3730a3">save to data/*.csv</text>

  <!-- 2. strategy -->
  <rect x="270" y="110" width="190" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="365" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#064e3b">strategy.py</text>
  <text x="365" y="168" text-anchor="middle" font-size="11" fill="#065f46">SMA 20 / SMA 50</text>
  <text x="365" y="184" text-anchor="middle" font-size="11" fill="#065f46">crossover detection</text>
  <text x="365" y="200" text-anchor="middle" font-size="11" fill="#065f46">signal column (+1/-1)</text>

  <!-- 3. backtest -->
  <rect x="520" y="110" width="190" height="100" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="615" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#7c2d12">backtest.py</text>
  <text x="615" y="168" text-anchor="middle" font-size="11" fill="#9a3412">signal &#8594; position</text>
  <text x="615" y="184" text-anchor="middle" font-size="11" fill="#9a3412">shift(1) - no lookahead</text>
  <text x="615" y="200" text-anchor="middle" font-size="11" fill="#9a3412">equity curve</text>

  <!-- 4. metrics -->
  <rect x="770" y="110" width="190" height="100" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="865" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#831843">metrics.py</text>
  <text x="865" y="168" text-anchor="middle" font-size="11" fill="#9d174d">Sharpe (vs Nifty 50)</text>
  <text x="865" y="184" text-anchor="middle" font-size="11" fill="#9d174d">CAGR</text>
  <text x="865" y="200" text-anchor="middle" font-size="11" fill="#9d174d">Max Drawdown</text>

  <!-- Arrows -->
  <line x1="210" y1="160" x2="266" y2="160" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="160" x2="516" y2="160" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="160" x2="766" y2="160" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Labels under arrows -->
  <text x="238" y="150" text-anchor="middle" font-size="10" fill="#6b7280">OHLCV df</text>
  <text x="488" y="150" text-anchor="middle" font-size="10" fill="#6b7280">df + signal</text>
  <text x="738" y="150" text-anchor="middle" font-size="10" fill="#6b7280">equity_curve</text>

  <!-- Benchmark input -->
  <rect x="770" y="30" width="190" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="865" y="59" text-anchor="middle" font-size="11" fill="#374151">Nifty 50 (^NSEI) benchmark</text>
  <line x1="865" y1="80" x2="865" y2="106" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- notebooks orchestration -->
  <rect x="270" y="250" width="440" height="50" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="490" y="280" text-anchor="middle" font-size="11" fill="#374151">notebooks/test.py &#8212; orchestrates the pipeline end to end</text>

  <text x="500" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Backtesting Engine — Data Flow</text>
</svg>
